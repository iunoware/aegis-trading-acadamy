name: Deploy Next.js Frontend (UI)

on:
  workflow_dispatch:

    # Optional: You can filter to only deploy UI when certain files change
    # paths:
    #   - 'src/app/(client)/**'

jobs:
  deploy-ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Copy Source Code to Frontend Site
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "./*"
          target: "/home/aegistradingacademy/htdocs/aegistradingacademy.com"
          rm: true

      - name: Install, Build, and Start UI
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/aegistradingacademy/htdocs/aegistradingacademy.com
            
            echo "Creating .env file..."

            cat > .env <<EOF
            DATABASE_URL="${{ secrets.DATABASE_URL }}"
            AUTH_SECRET="${{ secrets.AUTH_SECRET }}"
            SMTP_HOST="${{ secrets.SMTP_HOST }}"
            SMTP_PORT="${{ secrets.SMTP_PORT }}"
            SMTP_USER="${{ secrets.SMTP_USER }}"
            SMTP_PASS="${{ secrets.SMTP_PASS }}"
            SMTP_FROM="${{ secrets.SMTP_FROM }}"
            NEXT_PUBLIC_APP_URL="${{ secrets.NEXT_PUBLIC_APP_URL }}"
            NOWPAYMENTS_API_KEY="${{ secrets.NOWPAYMENTS_API_KEY }}"
            NOWPAYMENTS_IPN_SECRET="${{ secrets.NOWPAYMENTS_IPN_SECRET }}"
            NOWPAYMENTS_IPN_CALLBACK_URL="${{ secrets.NOWPAYMENTS_IPN_CALLBACK_URL }}"
            UPLOADS_ROOT="${{ secrets.UPLOADS_ROOT }}"
            EOF

            echo ".env file created."
            
            npm install
            npx prisma generate
            
            npm run build
            
            # Restart the Next.js app on the UI port (3307 as per your panel)
            pm2 stop aegis-ui || true
            pm2 start npm --name aegis-ui -- start -- -p 3307
            pm2 save
