name: Deploy Next.js Backend (API)

on:
  workflow_dispatch:

    # Optional: You can filter to only deploy API when API files change
    # paths:
    #   - 'src/app/api/**'
    #   - 'prisma/**'

jobs:
  deploy-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Copy Source Code to Backend Site
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "./*"
          target: "/home/aegistradingacademy-api/htdocs/api.aegistradingacademy.com"
          rm: true

      - name: Install, Build, and Start API
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/aegistradingacademy-api/htdocs/api.aegistradingacademy.com
            
            npm install
            npx prisma generate
            # Apply DB migrations (uncomment if you want auto-migrations)
            # npx prisma migrate deploy
            
            npm run build
            
            # Restart the Next.js app on the API port (3008 as per your panel)
            pm2 stop aegis-api || true
            pm2 start npm --name aegis-api -- start -- -p 3008
            pm2 save
